<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc">
  <title id="title">Finite window, persistent searchable memory</title>
  <desc id="desc">A long conversation flows into a small model window through Czip's map, search, and read path.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b32"/><stop offset="1" stop-color="#192b49"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#48d6c0"/><stop offset="1" stop-color="#74a8ff"/></linearGradient>
  </defs>
  <rect width="1100" height="310" rx="24" fill="url(#bg)"/>
  <text x="48" y="60" fill="#eef7ff" font-family="Arial, sans-serif" font-size="31" font-weight="700">One project. More history than fits.</text>
  <text x="48" y="92" fill="#aebed1" font-family="Arial, sans-serif" font-size="16">Test the same local model with and without persistent source memory.</text>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <rect x="48" y="132" width="225" height="102" rx="15" fill="#294165" stroke="#6887ac"/>
    <text x="160" y="173" fill="#eef7ff" font-size="19" font-weight="700">Long conversation</text>
    <text x="160" y="201" fill="#bed0e4">updates · tools · decisions</text>
    <path d="M280 183 H333" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="m328 174 13 9-13 9" fill="none" stroke="#6ac7e5" stroke-width="4"/>
    <rect x="348" y="132" width="220" height="102" rx="15" fill="#1b5d61" stroke="#48d6c0"/>
    <text x="458" y="173" fill="#f1fffb" font-size="19" font-weight="700">Czip archive</text>
    <text x="458" y="201" fill="#b9f4e7">map → search → read</text>
    <path d="M575 183 H628" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="m623 174 13 9-13 9" fill="none" stroke="#6ac7e5" stroke-width="4"/>
    <rect x="643" y="132" width="180" height="102" rx="15" fill="#294165" stroke="#6887ac"/>
    <text x="733" y="173" fill="#eef7ff" font-size="19" font-weight="700">Local model</text>
    <text x="733" y="201" fill="#bed0e4">finite window</text>
    <path d="M830 183 H883" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="m878 174 13 9-13 9" fill="none" stroke="#6ac7e5" stroke-width="4"/>
    <rect x="898" y="132" width="160" height="102" rx="15" fill="#27506f" stroke="#74a8ff"/>
    <text x="978" y="173" fill="#eef7ff" font-size="19" font-weight="700">Answer</text>
    <text x="978" y="201" fill="#bed0e4">with receipts</text>
  </g>
  <text x="48" y="276" fill="#74a8ff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Finite context. Persistent memory. Measured continuity.</text>
</svg>
