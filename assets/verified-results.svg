<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Verified Czip Continuity Gauntlet results on one local GLM model</title>
  <desc id="desc">At 615 messages Czip, rolling summary, and full history all scored eight of eight; last 24 messages scored one of eight. Czip used 71 thousand prompt tokens and full history 370 thousand. At 4015 messages across two seeds Czip scored sixteen of sixteen, last 24 messages two of sixteen.</desc>
