    <rect x="430" y="176" width="470" height="23" rx="8" fill="#2a3e5b"/><rect x="430" y="218" width="470" height="23" rx="8" fill="#2a3e5b"/><rect x="430" y="260" width="470" height="23" rx="8" fill="#2a3e5b"/><rect x="430" y="302" width="470" height="23" rx="8" fill="#2a3e5b"/>
    <rect x="430" y="176" width="470" height="23" rx="8" fill="#40d5af"/><rect x="430" y="218" width="470" height="23" rx="8" fill="#73aeff"/><rect x="430" y="260" width="470" height="23" rx="8" fill="#ae91ff"/><rect x="430" y="302" width="59" height="23" rx="8" fill="#e2aa68"/>
    <g font-size="15" font-weight="700" fill="#f2f7ff"><text x="913" y="194">8/8</text><text x="913" y="236">8/8</text><text x="913" y="278">8/8</text><text x="913" y="320">1/8</text></g>
    <g font-size="13" fill="#aebfd3"><text x="990" y="194">71k tokens</text><text x="990" y="236">88k</text><text x="990" y="278">370k</text><text x="990" y="320">16k</text></g>
