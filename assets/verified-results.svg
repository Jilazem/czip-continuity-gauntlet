  <text x="48" y="56" fill="#f2f7ff" font-family="Arial,sans-serif" font-size="29" font-weight="700">Same local GLM. Different memory paths.</text>
  <text x="48" y="83" fill="#b9c8d9" font-family="Arial,sans-serif" font-size="16">Grounded answers: exact answer + cited source message exposed to the model</text>
  <g font-family="Arial,sans-serif">
    <text x="48" y="132" fill="#f2f7ff" font-size="21" font-weight="700">615-message conversation · one seed</text>
    <text x="430" y="158" fill="#aabbd0" font-size="13">0</text><text x="916" y="158" fill="#aabbd0" font-size="13">8/8</text>
    <g font-size="17" fill="#dfe9f5">
      <text x="48" y="195">Czip</text><text x="48" y="237">Rolling summary</text><text x="48" y="279">Full history</text><text x="48" y="321">Last 24 messages</text>
